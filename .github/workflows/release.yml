name: AgentForge Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_extension: ""
          - os: macos-13
            target: x86_64-apple-darwin
            binary_extension: ""
          - os: macos-14
            target: aarch64-apple-darwin
            binary_extension: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary_extension: ".exe"

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Verify tagged workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${tag_version}" = "${workspace_version}"

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentforge-cli -p agentforge-daemon

      - name: Package release archive
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="snapshot-${GITHUB_SHA:0:12}"
          fi
          archive_root="agentforge-${version}-${{ matrix.target }}"
          mkdir -p "dist/${archive_root}"
          cp "target/${{ matrix.target }}/release/forge${{ matrix.binary_extension }}" "dist/${archive_root}/"
          cp "target/${{ matrix.target }}/release/forged${{ matrix.binary_extension }}" "dist/${archive_root}/"
          tar -czf "dist/${archive_root}.tar.gz" -C dist "${archive_root}"
          python -c 'import hashlib, pathlib; p=pathlib.Path("dist") / "'"${archive_root}"'.tar.gz"; print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")' > "dist/${archive_root}.tar.gz.sha256"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create consolidated checksums
        run: |
          find dist -maxdepth 1 -name '*.tar.gz' -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "AgentForge ${GITHUB_REF_NAME}"
