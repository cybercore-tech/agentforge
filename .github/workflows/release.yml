name: AgentForge Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_extension: ""
          - os: macos-14
            target: x86_64-apple-darwin
            binary_extension: ""
          - os: macos-14
            target: aarch64-apple-darwin
            binary_extension: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary_extension: ".exe"

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Verify tagged workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${tag_version}" = "${workspace_version}"

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentforge-platform -p agentforge-daemon

      - name: Package release archive
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="snapshot-${GITHUB_SHA:0:12}"
          fi
          archive_root="agentforge-${version}-${{ matrix.target }}"
          mkdir -p "dist/${archive_root}"
          cp "target/${{ matrix.target }}/release/forge${{ matrix.binary_extension }}" "dist/${archive_root}/"
          cp "target/${{ matrix.target }}/release/forged${{ matrix.binary_extension }}" "dist/${archive_root}/"
          tar -czf "dist/${archive_root}.tar.gz" -C dist "${archive_root}"
          python -c 'import hashlib, pathlib; p=pathlib.Path("dist") / "'"${archive_root}"'.tar.gz"; print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")' > "dist/${archive_root}.tar.gz.sha256"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    # Runs on tags (publishes) and on manual dispatch (dry run), so every packaging dry run also
    # exercises the full publish preparation; only the final upload is tag-only (P5-M002).
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Select release files and create consolidated checksums
        # Artifacts also contain each target's staging directory; only regular files are
        # released. Exactly four archives, each with its .sha256, are required.
        run: |
          set -euo pipefail
          mkdir release
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -exec cp {} release/ \;
          cd release
          archives=$(find . -maxdepth 1 -name '*.tar.gz' -type f | wc -l)
          if [ "$archives" -ne 4 ]; then
            echo "expected 4 archives, found $archives" >&2
            exit 1
          fi
          for archive in *.tar.gz; do
            test -f "$archive.sha256" || { echo "missing $archive.sha256" >&2; exit 1; }
            sha256sum -c "$archive.sha256"
          done
          find . -maxdepth 1 -name '*.tar.gz' -type f -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "release files:"
          ls -l

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The publish job has no checkout, so gh needs the repository explicitly.
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "AgentForge ${GITHUB_REF_NAME}"
